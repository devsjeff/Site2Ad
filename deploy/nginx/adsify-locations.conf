# Adsify routing, shared by adsify.local.conf (nginx on your machine) and adsify.conf.template (Docker).
# Expects upstreams named adsify_backend and adsify_frontend, and $connection_upgrade (defined next to them).

client_max_body_size 60m;            # video uploads are up to 50 MB (MAX_VIDEO_UPLOAD_BYTES)

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# API: scans, uploads, ads, video streaming (Range requests pass through)
location /api/ {
    proxy_pass http://adsify_backend;
    proxy_request_buffering off;     # stream large uploads straight to the backend
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Health checks and API docs
location = /health       { proxy_pass http://adsify_backend; }
location = /ready        { proxy_pass http://adsify_backend; }
location = /docs         { proxy_pass http://adsify_backend; }
location = /openapi.json { proxy_pass http://adsify_backend; }

# Everything else is the Next.js website (WebSocket upgrade keeps hot reload working with `npm run dev`)
location / {
    proxy_pass http://adsify_frontend;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
}
