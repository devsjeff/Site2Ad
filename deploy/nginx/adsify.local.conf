# nginx running on your machine. Put this file in nginx's conf.d (or include it inside http { ... }) and copy
# adsify-locations.conf next to nginx.conf. Backend: python -m app (port 8000). Frontend: npm run dev (port 3000).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream adsify_backend  { server 127.0.0.1:8000; }
upstream adsify_frontend { server 127.0.0.1:3000; }

server {
    listen 80;
    server_name _;
    include adsify-locations.conf;
}
